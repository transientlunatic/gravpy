name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[test,reference]"
      - name: Test
        run: pytest --cov=gravpy --cov-report=term-missing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Reports undefined names etc. Known failures are tracked as strict xfails in tests/;
      # make this blocking once they are fixed.
      - run: ruff check gravpy tests
        continue-on-error: true

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - name: Check package data is shipped
        run: |
          pip install dist/*.whl
          cd /tmp && python -c "import gravpy.interferometers as i; i.AdvancedLIGO(configuration='A+').psd(i.AdvancedLIGO.frequencies)"
